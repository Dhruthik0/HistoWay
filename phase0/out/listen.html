<script>
const STORIES = [{"script": "Look ahead, and you’ll see a grand building of granite, with tall pillars and a great dome rising above them. This is Vidhana Soudha. But its story begins with a man who wanted something more than just another government building.\n\nLong ago, after India became independent, Bengaluru became the capital of Mysore State. The government needed a bigger home for its lawmakers. And Kengal Hanumanthaiah, the Chief Minister, had a special idea. He wanted a building that would belong to the people, not remind them of colonial rule.\n\nThen came an unusual turning point. During a visit to Bengaluru, Soviet diplomats questioned why European architecture dominated the city. Another memory also mattered: Winston Churchill’s remark about Mahatma Gandhi had become part of the debate over how India should represent itself.\n\nSo Hanumanthaiah pushed for something different. Instead of copying European buildings, the new structure would draw on Indian architectural traditions, especially the Dravidian style.\n\nBut here's the thing: the grand plan wasn't without criticism. Opposition leaders accused the government of spending too much, and an inquiry committee was appointed to examine the claims.\n\nToday, those towering pillars stand for a different idea: a government building meant to serve its people.", "more_script": null, "claims": [{"text": "Vidhana Soudha is a granite building with tall pillars and a central dome.", "kind": "verified"}, {"text": "After India became independent, Bengaluru became the capital of Mysore State.", "kind": "verified"}, {"text": "Kengal Hanumanthaiah wanted the new legislative building to represent the people rather than colonial authority.", "kind": "verified"}, {"text": "Soviet diplomats questioned the dominance of European architecture in Bengaluru during an official visit in 1954.", "kind": "verified"}, {"text": "Winston Churchill's remark about Mahatma Gandhi was linked by historians to the government's choice of Dravidian-style architecture.", "kind": "verified"}, {"text": "Opposition leaders accused the government of excessive spending, leading to the appointment of an inquiry committee.", "kind": "verified"}, {"text": "Vidhana Soudha was envisioned as a government building intended to serve the people.", "kind": "verified"}], "has_dark_history": false, "name": "Vidhana Soudha", "tier": "M", "sensitive": false, "url": "https://en.wikipedia.org/wiki/Vidhana_Soudha", "flags": []}, {"script": "Look across the road from Vidhana Soudha, and you'll see a red building with a story that nearly ended in its destruction. Long ago, this was where the rulers of Mysore kept their government offices. But here's the thing: by the nineteen fifties, some leaders wanted it gone. They saw the building as a reminder of British colonial rule. A grand new legislature building rose right opposite it, so imposing that a government committee believed it was meant to overshadow the old red offices.\n\nAnd years later, the danger returned. In 1982, the government approved plans to demolish Attara Kacheri and build a new court in its place. Imagine the strange twist: the High Court, inside the very building marked for destruction, heard a case challenging that decision. The case went to the Supreme Court of India, which asked the state government to reconsider.\n\nAnd then, the story turned. In 1985, the demolition plan was abandoned, and repairs began. The old building survived, and its halls continued to serve as Karnataka's High Court.\n\nThat red building across the road? It came remarkably close to disappearing.", "more_script": null, "claims": [{"text": "Attara Kacheri is a red-painted stone-and-brick building opposite Vidhana Soudha.", "kind": "verified"}, {"text": "In the early nineteen fifties, Chief Minister Kengal Hanumanthaiah wanted to demolish Attara Kacheri because he saw it as a vestige of colonialism.", "kind": "verified"}, {"text": "A government committee concluded that the Vidhana Soudha was intended to visually overshadow Attara Kacheri.", "kind": "verified"}, {"text": "On 24 March 1982, the Government of Karnataka approved the demolition of Attara Kacheri and construction of a new court building.", "kind": "verified"}, {"text": "The demolition decision was challenged in a case heard by the High Court in the building itself.", "kind": "verified"}, {"text": "The Supreme Court of India asked the state government to reconsider its demolition proposal.", "kind": "verified"}, {"text": "In 1985, the demolition proposal was dropped and repair and expansion work began.", "kind": "verified"}, {"text": "Attara Kacheri continues to house the Karnataka High Court.", "kind": "verified"}], "has_dark_history": false, "name": "Attara Kacheri", "tier": "M", "sensitive": false, "url": "https://en.wikipedia.org/wiki/Attara_Kacheri", "flags": []}, {"script": "Long ago, imagine a city where a patch of green was about to become something much more than a place to escape the streets. Picture this: central Bengaluru, and a stretch of land being shaped into a public park under the direction of Major General Richard Sankey, the British Chief Engineer of Mysore State. The year was eighteen seventy, and the park covered about a hundred acres.\n\nBut here's the thing. The park's name would keep changing, almost like it was collecting memories along the way. First, it was called Meade's Park, after Sir John Meade, the acting commissioner of Mysuru. Then, when Meade left for a new assignment in Baroda, the park received another name: Cubbon Park, honouring Sir Mark Cubbon, the longest-serving commissioner of the time.\n\nAnd the story didn't end there. Decades later, the park was renamed Sri Chamarajendra Park to honour a Mysore ruler during whose reign it had come into existence.\n\nToday, trees, flowerbeds and walking paths fill this green space, surrounded by the busy city. Now look out of your window. In the middle of all that movement, a park still carries the memory of the people whose names it once bore.", "more_script": null, "claims": [{"text": "Cubbon Park was originally created in 1870 under Major General Richard Sankey, the British Chief Engineer of Mysore State.", "kind": "verified"}, {"text": "The park originally covered about 100 acres.", "kind": "verified"}, {"text": "The park was first named Meade's Park after Sir John Meade, the acting commissioner of Mysuru.", "kind": "verified"}, {"text": "After Meade left for a new assignment in Baroda, the park was renamed Cubbon Park after Sir Mark Cubbon, the longest-serving commissioner of the time.", "kind": "verified"}, {"text": "The park was later renamed Sri Chamarajendra Park in honour of Sri Chamarajendra Wodeyar, during whose rule the park came into existence.", "kind": "verified"}, {"text": "Trees, flowerbeds and walking paths are features of the park.", "kind": "verified"}], "has_dark_history": false, "name": "Cubbon Park", "tier": "M", "sensitive": false, "url": "https://en.wikipedia.org/wiki/Cubbon_Park", "flags": []}, {"script": "Picture this road long ago, when it was known as South Parade. Shops, offices and theatres would one day line this busy stretch of Bengaluru. But here's the thing: the road itself would get a new name. On the twenty-sixth of February, nineteen forty-eight, it became Mahatma Gandhi Road. Today, as traffic flows past, that old name survives only in the story of the street.", "more_script": null, "claims": [{"text": "M G Road was known as South Parade before independence.", "kind": "verified"}, {"text": "M G Road was renamed Mahatma Gandhi Road on 26 February 1948.", "kind": "verified"}, {"text": "M G Road is lined with shops, offices and theatres.", "kind": "verified"}], "has_dark_history": false, "name": "M G Road, Bengaluru", "tier": "S", "sensitive": false, "url": "https://en.wikipedia.org/wiki/M_G_Road,_Bengaluru", "flags": []}, {"script": "Long ago, a king decided that Bengaluru needed a garden unlike any other. But he had a bigger dream than simply planting flowers. He wanted to create a place where nature could grow richer with every passing year.\n\nPicture this. King Hyder Ali has begun building a garden in Bengaluru. He wants it designed along the lines of the famous Mughal Gardens. The paths, the greenery, the flowers — everything is part of a grand idea. But there is one thing this garden needs to become truly special. Plants from far beyond the kingdom.\n\nAnd that is where his son, King Tipu Sultan, enters the story.\n\nHyder Ali began the garden, but Tipu Sultan carried the work forward. He brought trees and plants from several countries, adding new life and variety to the growing collection. Imagine plants travelling across great distances to find a home in this garden. Each new arrival made the place a little more extraordinary.\n\nBut here's the thing. The garden's story did not end with the kings who created it.\n\nAfter the British conquest of the Kingdom of Mysore, Lalbagh passed through the hands of different administrators. For a time, it was even left without proper management. Then came a man who saw that its future should be about more than simply growing things to sell.\n\nHis name was Hugh Cleghorn, a botanical advisor appointed in the nineteenth century. He believed Lalbagh should help people make better use of plants native to India. It should also introduce useful plants from elsewhere and exchange seeds and plant materials with other gardens.\n\nThat idea helped give Lalbagh a new purpose. In time, it became a government botanical garden, with professional horticulturists caring for its growing collection.\n\nNow look out of your window as you pass through south Bengaluru. Behind the garden gates is a place shaped by royal ambition, distant journeys and the patient work of people who believed plants could do more than make a place beautiful.\n\nAnd there is one more surprise. The great glass house you may know from pictures was built much later, inspired by London's Crystal Palace, turning flowers into the stars of grand public shows.\n\nA king planted the dream. His son brought the world into it. And the garden kept growing.", "more_script": "Imagine walking through Lalbagh long ago, when the garden was becoming something much bigger than a royal retreat.\n\nThere is a new challenge. How do you turn a collection of plants into a place that can help an entire region learn about nature and agriculture?\n\nIn the nineteenth century, Hugh Cleghorn had a clear answer. He wanted Lalbagh to become a place for useful plants, careful cultivation and the exchange of seeds with other gardens. He opposed turning it into a commercial enterprise alone. Instead, he wanted indigenous plants to be better understood and useful exotic species to be introduced.\n\nUnder these ideas, Lalbagh became a government botanical garden. A professional horticulturist named William New arrived from Kew to take charge. The collection continued to grow, with plants valued for beauty and for practical uses.\n\nThen came another important figure: John Cameron, who took over after William New's time at the garden. During Cameron's years, the collection expanded further. A central glass house was added for flower shows, with iron pillars cast by a company in Glasgow.\n\nPicture that glass house filled with flowers. What had begun as a king's garden had become a place where the public could gather to admire the work of nature and horticulture.\n\nBut Lalbagh's history was not always a story of growth. After a plague, maintenance deteriorated, and there were proposals to close its menagerie and aviary. The garden's future required care, not just grand ideas.\n\nToday, Lalbagh is known for its trees, rare plants, flower shows and ancient rock formation. Its story reminds us that gardens are never made by one person alone. They survive because generation after generation decides they are worth looking after.\n\nAnd beneath Lalbagh's trees, that long story is still growing.", "claims": [{"text": "Lalbagh was commissioned by Hyder Ali in 1760, and his son Tipu Sultan completed it.", "kind": "verified"}, {"text": "Hyder Ali based the garden's design on Mughal Gardens.", "kind": "verified"}, {"text": "Tipu Sultan added trees and plants imported from several countries.", "kind": "verified"}, {"text": "After the British conquest of the Kingdom of Mysore in 1799, Lalbagh came under different administrators.", "kind": "verified"}, {"text": "Hugh Cleghorn advocated improving the use of indigenous plants, introducing useful exotic species and exchanging seeds with other gardens.", "kind": "verified"}, {"text": "Lalbagh became the Government Botanical Garden in 1856.", "kind": "verified"}, {"text": "William New arrived from Kew in 1858 to work at Lalbagh.", "kind": "verified"}, {"text": "John Cameron introduced additional plants and helped establish the glass house for flower shows.", "kind": "verified"}, {"text": "The glass house was inspired by London's Crystal Palace.", "kind": "verified"}, {"text": "Following a plague, maintenance deteriorated and proposals were made to close the menagerie and aviary.", "kind": "verified"}, {"text": "Lalbagh continues to be known for its plant collection, flower shows, trees and ancient rock formation.", "kind": "verified"}], "has_dark_history": true, "name": "Lal Bagh", "tier": "L", "sensitive": true, "url": "https://en.wikipedia.org/wiki/Lal_Bagh", "flags": []}, {"script": "Look out at the hills around Ramanagara. These rocky slopes have a story that travelled all the way to the silver screen. Long ago, this town was known by other names, including Closepet and Shamsherabad. But one day, its hills became the setting for a film that would make them famous far beyond Karnataka. In nineteen seventy-five, the Bollywood movie Sholay was shot among these very hills. And then, something curious happened. The hills became known by another name: Sholay Hills. Imagine driving past these rocks, knowing that the same landscape once appeared in a film loved by audiences across India. Can you guess what happened next? The hills didn't just keep their old identity. They also carried the name of the movie that had been filmed there. Today, they are also called Ramagiri Hills. But here's the thing about Ramanagara. Its story isn't only written in cinema. The town is also known as Silk Town, because the silk produced here becomes an important ingredient in the famous Mysore Silk. So, as those hills rise beside your road, remember: you're passing a place where movie history and the story of silk meet.", "more_script": null, "claims": [{"text": "Ramanagara is approximately fifty kilometres from Bengaluru.", "kind": "verified"}, {"text": "The Bollywood movie Sholay was shot in the surrounding hills of Ramanagara in nineteen seventy-five.", "kind": "verified"}, {"text": "The surrounding hills are also called Ramagiri Hills and Sholay Hills.", "kind": "verified"}, {"text": "Ramanagara is nicknamed Silk Town and Silk City because of its sericulture.", "kind": "verified"}, {"text": "Silk produced in the Ramanagara region forms the input for the famous Mysore Silk.", "kind": "verified"}], "has_dark_history": false, "name": "Ramanagara", "tier": "M", "sensitive": false, "url": "https://en.wikipedia.org/wiki/Ramanagara", "flags": []}, {"script": "Look out at the water for a moment. Long ago, people along this river watched it bring something precious to their fields: golden-coloured silt, spread across the land when the river flooded. That is why, in classical Tamil literature, the Kaveri was lovingly called Ponni, the golden one.\n\nBut here's the thing about this river. Its story begins not just with the land, but with a legend. The story goes that the river came into being when Ganesha, disguised as a crow, overturned the water vessel of the sage Agastya. It is a sacred tale told in the Skanda Purana, and it gives the Kaveri a beginning filled with wonder.\n\nNow, look where you are. Near Srirangapatna, the river forms an island before continuing its journey eastward. Its waters have supported farming here for centuries, but sharing those waters has also brought a long-standing dispute between Karnataka and Tamil Nadu. The same river that gives life to fields can become a source of disagreement when water is scarce.\n\nAnd yet, here it flows, carrying stories of faith, fertile earth, and lives shaped by its waters. The river beside your window is more than water. It is Ponni, the golden one.", "more_script": null, "claims": [{"text": "In classical Tamil literature, the Kaveri is called Ponni, meaning the golden one, in reference to the gold-coloured fertile silt it deposited along its delta during floods.", "kind": "verified"}, {"text": "According to a legend in the Skanda Purana, Ganesha, disguised as a crow, overturned sage Agastya's water vessel, giving rise to the river.", "kind": "legend"}, {"text": "Near Srirangapatna, the Kaveri forms a river island before continuing eastward.", "kind": "verified"}, {"text": "The Kaveri has supported agriculture in the region for centuries.", "kind": "verified"}, {"text": "Sharing the Kaveri's waters has been a long-standing dispute between Karnataka and Tamil Nadu.", "kind": "verified"}], "has_dark_history": true, "name": "Kaveri", "tier": "M", "sensitive": false, "url": "https://en.wikipedia.org/wiki/Kaveri", "flags": []}, {"script": "The river is drawing close around a town with a remarkable past. Long ago, Srirangapatna was more than a place to stop on the road. It was the fortress that stood between the Kingdom of Mysore and its enemies. And one day, that fortress became the stage for a battle that changed everything.\n\nPicture this. Inside the fort is Tipu Sultan, the ruler of Mysore. Outside, a combined army of fifty thousand men, provided by the Nizam of Hyderabad and the British East India Company, is closing in. The year is seventeen ninety-nine, and this is the decisive battle of the Fourth Anglo-Mysore War.\n\nTipu Sultan had fought the British before. But this time, the struggle would end here, within these walls.\n\nAnd then came the turning point. At the climax of the battle, Tipu Sultan was killed inside the fort. The account tells us that he was betrayed by one of his own confidants. Imagine the weight of that moment. The ruler who had made this town his capital was gone, and with him ended this decisive struggle for Mysore.\n\nBut the story does not end with the battle. The victorious army plundered Srirangapatna and ransacked Tipu's palace. Gold, cash, precious objects and personal belongings were shipped to England. Tipu's clothing, shoes, sword and firearms were among the possessions taken away. Many remain in the British Royal Collection and the Victoria and Albert Museum.\n\nYet not everything disappeared. Much of the battlefield still remains. The fort's ramparts, the Water Gate and the area where British prisoners were held can still be found here. A memorial marks the place where Tipu Sultan fell.\n\nAnd that is what makes this stretch of road so extraordinary. Beneath the quiet landscape lies the memory of a kingdom's final battle, a ruler's death, and the destruction and plunder that followed.\n\nLook out toward Srirangapatna now. The old fort still stands, holding the memory of the day its walls witnessed the end of an era.", "more_script": "There is another remarkable story written into Srirangapatna's walls. To understand it, we must go back to a time when controlling this town meant much more than controlling a patch of land.\n\nLong ago, Srirangapatna was the seat of an important authority under the Vijayanagara Empire. When that empire began to decline, the rulers of Mysore moved to assert their independence. Their first target was Srirangapatna.\n\nIn sixteen ten, Raja Wodeyar the First defeated Rangaraya, the town's viceroy. After the victory, Raja Wodeyar celebrated the Navaratri festival here. Over time, two things came to represent control over the Kingdom of Mysore: successfully holding the ten-day Navaratri festival, dedicated to Chamundeshwari, and controlling the fort at Srirangapatna.\n\nThink about that for a moment. A festival and a fortress. One brought people together in devotion; the other stood ready to defend a kingdom. Together, they became powerful symbols of who held authority over Mysore.\n\nAnd the fort's importance only grew. When Hyder Ali and Tipu Sultan ruled, Srirangapatna became the capital of Mysore. It was the kingdom's last line of defence against invasion, standing closer to the capital city of Mysore than any other fortress.\n\nBut there was a painful side to Tipu Sultan's wars. During his campaigns against the British, the Kodavas and the rulers of Malabar, entire communities of Nairs, Kodavas and Mangalorean Catholics were rounded up in conquered regions and deported to Srirangapatna. They were held in bondage until Tipu's defeat by the British in seventeen ninety-nine brought their captivity to an end.\n\nSo this town carries more than the story of a fort and a fallen ruler. It also remembers people who were forcibly taken from their homes and held captive.\n\nToday, the old walls remain. Their stones have witnessed both the symbols of a kingdom's power and the suffering that came with its wars.", "claims": [{"text": "Srirangapatna was the capital of Mysore under Hyder Ali and Tipu Sultan.", "kind": "verified"}, {"text": "A combined force of fifty thousand men, provided equally by the Nizam of Hyderabad and the East India Company, fought Tipu Sultan's forces in the decisive Battle of Seringapatam in seventeen ninety-nine.", "kind": "verified"}, {"text": "Tipu Sultan was killed inside the fort at the climax of the battle, and the account states that he was betrayed by one of his own confidants.", "kind": "verified"}, {"text": "The victorious army plundered Srirangapatna and ransacked Tipu Sultan's palace.", "kind": "verified"}, {"text": "Valuables and Tipu Sultan's personal possessions were shipped to England, and many remain in the British Royal Collection and the Victoria and Albert Museum.", "kind": "verified"}, {"text": "The fort's ramparts, the Water Gate, the area where British prisoners were held, and a memorial marking the place where Tipu Sultan fell remain at the site.", "kind": "verified"}, {"text": "Raja Wodeyar the First defeated Rangaraya in sixteen ten and celebrated Navaratri in Srirangapatna that year.", "kind": "verified"}, {"text": "Control of the Srirangapatna fort and successful celebration of the ten-day Navaratri festival became symbols of sovereignty over the Kingdom of Mysore.", "kind": "verified"}, {"text": "During Tipu Sultan's wars, entire communities of Nairs, Kodavas and Mangalorean Catholics were deported to Srirangapatna and held in bondage until his defeat by the British in seventeen ninety-nine.", "kind": "verified"}], "has_dark_history": true, "name": "Srirangapatna", "tier": "L", "sensitive": true, "url": "https://en.wikipedia.org/wiki/Srirangapatna", "flags": []}, {"script": "Imagine arriving at Mysore Palace and discovering that the magnificent building before you exists because of a terrible fire. Long ago, this was already a royal home, but one wedding celebration would change its story forever.\n\nThe day was February twentieth, eighteen ninety-seven. A wedding ceremony had just taken place for Jayalakshmi Ammanni, the eldest princess of Chamarajendra. Then, a fire swept through the northern part of the palace.\n\nAnd what happened next was heartbreaking. Eight people lost their lives. One-fifth of the building was destroyed, including the grand assembly hall, the royal armory, the Sanskrit library, and the music room. Only the living quarters at the back escaped unharmed.\n\nPicture the scene. A place that had served as the home of kings had suddenly lost some of its most important rooms. The royal family could no longer remain there while the damage was addressed. So they moved to the nearby Jaganmohan Palace.\n\nBut here's the thing. The story of Mysore Palace did not end in those ashes.\n\nAt the time, Mysore was ruled by Kempananjammanni Devi, who was acting as regent for the young Krishnaraja Wodeyar the Fourth. She commissioned two British architects, Henry Irwin and Edwin Wolleston Fritchley, to create a new palace.\n\nKempananjammanni had a particular reason for choosing Irwin. She had been impressed by his design for the Viceregal Lodge in Shimla. Now, she entrusted him with the task of rebuilding the royal residence in Mysore.\n\nThis time, the new building would rely mainly on stone, brick, and iron, keeping easily flammable materials to a minimum. Hundreds of carvers and thousands of masons worked on its construction. They shaped intricate designs of plants and animals into marble, granite, and teak.\n\nThe work began in eighteen ninety-seven. It took until nineteen twelve for the new palace to be completed.\n\nAnd now, look out at the palace before you. Its grand appearance hides a story of loss, a royal family's temporary departure, and an enormous effort to build again.\n\nThe palace you see today rose from the ruins of a fire.", "more_script": "Now, here's another story hidden in the palace you see before you. Imagine a young king, just five years old, being placed on the throne of Mysore.\n\nThat was Krishnaraja Wodeyar the Third, whose reign began after Tipu Sultan died at the Battle of Srirangapatna in seventeen ninety-nine. The British installed the young ruler and began rebuilding the palace, which had been demolished by Tipu in seventeen ninety-three.\n\nThe stones and other materials from the old palace had been used to begin building a new fortress called Nazarabad. The royal residence in Mysore had to be rebuilt, and the project took four years.\n\nWhen the new wooden palace was completed, Mysore became the capital of the kingdom. In eighteen oh five, Krishnaraja held the first royal assembly there during Navaratri.\n\nBut the palace was much more than a home for a king. It became a place where thousands of people worked. Soldiers, Brahmins, servants, and other workers all had roles in its daily life. By eighteen thirty-six, estimates put the number of people employed at the palace at about six thousand. By the time Krishnaraja died, that estimate had grown to ten thousand people, roughly one out of every six residents of Mysore.\n\nThink about that for a moment. Behind the royal ceremonies and the palace walls was an entire community of workers helping keep the royal household running.\n\nAnd the palace's story still carries traces of its changing ownership. In nineteen ninety-eight, the Karnataka state government acquired ownership from the Wadiyar family through legislation. That decision was challenged in court, and the legal dispute remains ongoing according to the account provided.\n\nSo when you look at Mysore Palace, you're seeing more than a royal residence. You're looking at a place that has been demolished, rebuilt, filled with ceremony, and shaped by changing power.\n\nEven its walls have witnessed the kingdom change around them.", "claims": [{"text": "Mysore Palace was largely damaged by a fire on February twentieth, eighteen ninety-seven, following the wedding ceremony of Jayalakshmi Ammanni.", "kind": "verified"}, {"text": "The fire killed eight people and destroyed one-fifth of the building, including the durbar hall, armory, Sanskrit library, and music room.", "kind": "verified"}, {"text": "The living quarters at the rear of the palace escaped the fire unharmed.", "kind": "verified"}, {"text": "Kempananjammanni Devi commissioned Henry Irwin and Edwin Wolleston Fritchley to build a new palace.", "kind": "verified"}, {"text": "Kempananjammanni Devi chose Henry Irwin after being impressed by his design for the Viceregal Lodge in Shimla.", "kind": "verified"}, {"text": "The rebuilt palace was constructed mainly of stone, brick, and iron to reduce the use of inflammable materials.", "kind": "verified"}, {"text": "Hundreds of carvers and thousands of masons worked on the palace, creating intricate carvings of flora and fauna.", "kind": "verified"}, {"text": "Construction of the current palace began in eighteen ninety-seven and was completed in nineteen twelve.", "kind": "verified"}, {"text": "After Tipu Sultan's death at the Battle of Srirangapatna in seventeen ninety-nine, the British installed five-year-old Krishnaraja Wodeyar the Third on the throne.", "kind": "verified"}, {"text": "Tipu Sultan demolished the palace and parts of the fort walls in seventeen ninety-three and used the materials to begin a new fortress called Nazarabad.", "kind": "verified"}, {"text": "The restored palace was completed after four years, and Mysore became the capital of the Kingdom of Mysore.", "kind": "verified"}, {"text": "Krishnaraja held the first durbar at the palace in eighteen oh five during Navaratri.", "kind": "verified"}, {"text": "An estimated six thousand people worked at the palace by eighteen thirty-six.", "kind": "verified"}, {"text": "By the time Krishnaraja died, an estimated ten thousand people worked at the palace, roughly one out of every six residents of Mysore.", "kind": "verified"}, {"text": "In nineteen ninety-eight, the Karnataka state government acquired ownership of Mysore Palace from the Wadiyar family, and the acquisition was challenged in court.", "kind": "verified"}], "has_dark_history": true, "name": "Mysore Palace", "tier": "L", "sensitive": false, "url": "https://en.wikipedia.org/wiki/Mysore_Palace", "flags": []}, {"script": "Look up at that hill rising above Mysuru. Long ago, according to local legend, a mighty demon named Mahishasura ruled the city. And then came a fierce battle. His opponent was the goddess Chamundeshwari, also known as Chamundi. The story says that she fought Mahishasura and killed him, earning the name Mahishasura Mardini. But here's the thing: the story of this battle is connected to the very name of the city below you. Mysuru comes from an old Kannada word, Mahishooru, meaning the village of Mahishasura. Can you imagine a city's name carrying the memory of a legendary battle? Now look a little higher, towards the summit. There stands the Chamundeshwari Temple, named after the goddess at the heart of this story. For centuries, Mysore's rulers patronised the temple, and the hill became an important place of pilgrimage. There's even an ancient stone stairway leading up the hill, with more than a thousand steps. And from the summit, the city spreads out below, with Mysore Palace visible in the distance. That hill on the skyline isn't just a landmark. It's where Mysuru's legend reaches for the sky.", "more_script": null, "claims": [{"text": "Chamundi Hill rises above Mysuru, and the Chamundeshwari Temple is located at its summit.", "kind": "verified"}, {"text": "According to local legend, Mahishasura ruled the city and was killed by the goddess Chamundeshwari after a fierce battle.", "kind": "legend"}, {"text": "Chamundeshwari is also known as Chamundi and Mahishasura Mardini.", "kind": "verified"}, {"text": "The name Mysuru comes from the old Kannada word Mahishooru, meaning the village of Mahishasura.", "kind": "verified"}, {"text": "Mysore's rulers patronised the Chamundeshwari Temple for centuries.", "kind": "verified"}, {"text": "An ancient stone stairway with more than a thousand steps leads to the summit of Chamundi Hill.", "kind": "verified"}, {"text": "Mysore Palace is visible from the summit of Chamundi Hill.", "kind": "verified"}], "has_dark_history": false, "name": "Chamundi Hills", "tier": "M", "sensitive": false, "url": "https://en.wikipedia.org/wiki/Chamundi_Hills", "flags": []}];

let queue = [];

function loadVoices() {
  const lang = v => v.lang.replace('_', '-');  // Android reports en_IN, desktop en-IN
  const voices = synth.getVoices().filter(v => lang(v).startsWith('en'));
  voices.sort((a, b) => (lang(b) === 'en-IN') - (lang(a) === 'en-IN'));
  voiceSel.innerHTML = voices.map((v, i) => `<option value="${i}">${v.name} (${v.lang})${v.localService ? '' : ' [online]'}</option>`).join('');
  voiceSel.voices = voices;
}
synth.onvoiceschanged = loadVoices; loadVoices();

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function speak(i, text, then) {
  synth.cancel();
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('playing', c.dataset.i == i));
  // One utterance per sentence: Chrome cuts long utterances off partway with some voices.
  const parts = text.match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g) || [text];
  parts.forEach((p, k) => {
    const u = new SpeechSynthesisUtterance(p.trim());
    u.voice = voiceSel.voices?.[voiceSel.value] || null;
    u.rate = 1.05; u.pitch = 1.1;  // a touch livelier than the flat default
    if (k === parts.length - 1) u.onend = () => then && then();
    synth.speak(u);
  });
}

function playNext() {
  if (!queue.length) return;
  const i = queue.shift();
  speak(i, STORIES[i].script, () => setTimeout(playNext, 1500));
}

list.innerHTML = STORIES.map((s, i) => `
  <div class="card" data-i="${i}">
    <strong>${i + 1}. ${esc(s.name)}</strong>
    <span class="meta"> tier ${s.tier} · ${s.script.split(/\s+/).length} words${s.sensitive ? ' · SENSITIVE, review by hand' : ''}${s.has_dark_history ? ' · dark history' : ''}</span>
    ${s.flags.map(f => `<div class="flag">⚠ ${esc(f)}</div>`).join('')}
    <p>${esc(s.script)}</p>
    <button onclick="queue=[];speak(${i}, STORIES[${i}].script)">Play</button>
    ${s.more_script ? `<button onclick="queue=[];speak(${i}, STORIES[${i}].more_script)">Tell me more</button>` : ''}
    <a href="${esc(s.url)}" target="_blank" rel="noopener">Article</a>
    <details><summary>Claims (${s.claims.length})</summary>
      <ul>${s.claims.map(c => `<li><em>${esc(c.kind)}</em>: ${esc(c.text)}</li>`).join('')}</ul>
    </details>
    ${s.more_script ? `<details><summary>More script</summary><p>${esc(s.more_script)}</p></details>` : ''}
  </div>`).join('');

document.getElementById('all').onclick = () => { queue = STORIES.map((_, i) => i); playNext(); };
document.getElementById('stop').onclick = () => { queue = []; synth.cancel(); };
</script>
</body>
</html>
